<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LYNKO CHAT</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LYNKO CHAT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function(){var t='auto';try{t=localStorage.getItem('theme')||'auto'}catch(e){}
var d=t=='dark'||(t=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#000000':'#f2f2f7'})();
</script>
<style>
:root{--ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
--rose:#ff4d86;--lilac:#a35cff;--grad:linear-gradient(135deg,#ff5c8a,#b44dff)}
html[data-theme=dark]{--bg:#000;--card:#1c1c1e;--txt:#fff;--mut:#98989f;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24)}
html[data-theme=light]{--bg:#f2f2f7;--card:#fff;--txt:#000;--mut:#6c6c70;--line:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--ios);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;display:grid;place-items:center;
padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 380px at 50% -5%,rgba(255,77,134,.28),transparent 70%),radial-gradient(480px 380px at 100% 100%,rgba(163,92,255,.2),transparent 70%)}
.wrap{position:relative;width:100%;max-width:400px}
.hd{text-align:center;margin-bottom:26px}
.hd img{width:92px;height:92px;border-radius:22px;box-shadow:0 14px 38px rgba(255,77,134,.35);background:#1a0713;object-fit:cover}
.hd h1{font-size:28px;font-weight:800;letter-spacing:.5px;margin-top:16px}
.hd p{color:var(--mut);font-size:15px;margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:18px}
.seg button{border:0;background:none;color:var(--txt);font:600 14px var(--ios);padding:8px;border-radius:7px;cursor:pointer;transition:.18s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.18)}
html[data-theme=dark] .seg button.on{background:#636366}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.fld{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;border-bottom:.5px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld[hidden]{display:none}
.fld label{width:84px;flex:none;font-size:16px}
.fld input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--txt);font:17px var(--ios);padding:14px 0}
.fld input::placeholder{color:var(--mut);opacity:.7}
.eye{border:0;background:none;color:var(--mut);font-size:17px;cursor:pointer;padding:6px}
.go{width:100%;border:0;cursor:pointer;color:#fff;font:600 17px var(--ios);padding:15px;border-radius:14px;background:var(--grad);box-shadow:0 8px 24px rgba(255,77,134,.32)}
.go:active{transform:scale(.98);opacity:.92}.go:disabled{opacity:.55}
.ghost{background:var(--fill);color:var(--rose);box-shadow:none;margin-top:10px}
#err{min-height:22px;color:#ff453a;font-size:14px;margin-top:10px;text-align:center}
.note{margin-top:8px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="glow"></div>
<main class="wrap">
  <div class="hd"><img src="/icons/icon-192.png" alt=""><h1>LYNKO CHAT</h1><p>Private chats that disappear in 24 hours</p></div>
  <div class="seg"><button id="tl" class="on">Log in</button><button id="tr">Sign up</button></div>
  <div class="grp">
    <div class="fld" id="fn" hidden><label for="nm">Name</label><input id="nm" placeholder="Your name" autocomplete="name" maxlength="30"></div>
    <div class="fld"><label for="ph">Number</label><input id="ph" type="tel" inputmode="tel" placeholder="07X XXX XXXX" autocomplete="tel"></div>
    <div class="fld"><label for="p">Password</label><input id="p" type="password" placeholder="6+ characters" autocomplete="current-password"><button class="eye" id="eye" type="button" aria-label="Show password">👁</button></div>
  </div>
  <button class="go" id="go">Log in</button>
  <button class="go ghost" id="inst" type="button" hidden>📲 Install LYNKO CHAT app</button>
  <div id="err"></div>
  <p class="note">Messages are encrypted on your device. Not even the server can read them. If you forget your password, your chats can't be recovered. One number can be signed in on one device at a time.</p>
</main>
<script>
const $=id=>document.getElementById(id), enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// phone number -> digits with country code (must match the server): 0771234567 / 771234567 -> 94771234567
const CC='94';
const normPhone=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.length==10&&d[0]=='0')d=CC+d.slice(1);else if(d.length==9)d=CC+d;return d};
async function kdf(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:150000},m,256)}
const wrapKey=async(pw,u)=>crypto.subtle.importKey('raw',await kdf(pw,'wrap:'+u),'AES-GCM',false,['encrypt','decrypt']);
const authOf=async(pw,u)=>hex(await kdf(pw,'auth:'+u));   // server never sees the real password

let mode='login';
function setMode(m){mode=m;$('tl').classList.toggle('on',m=='login');$('tr').classList.toggle('on',m!='login');$('fn').hidden=m=='login';
  $('go').textContent=m=='login'?'Log in':'Create account';$('p').autocomplete=m=='login'?'current-password':'new-password';$('err').textContent=''}
$('tl').onclick=()=>setMode('login');$('tr').onclick=()=>setMode('reg');
$('eye').onclick=()=>{const p=$('p');p.type=p.type=='password'?'text':'password'};

async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}

$('go').onclick=async()=>{
  const phone=normPhone($('ph').value), pw=$('p').value, name=$('nm').value.trim();
  if(mode=='reg'&&!name){$('err').textContent='Enter your name';return}
  if(!/^\d{9,15}$/.test(phone)){$('err').textContent='Enter a valid phone number';return}
  if(pw.length<6){$('err').textContent='Password must be 6+ characters';return}
  $('go').disabled=true;$('err').textContent=mode=='reg'?'Creating your keys…':'';
  try{
    const auth=await authOf(pw,phone), wk=await wrapKey(pw,phone);
    let me,priv;
    if(mode=='reg'){
      const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
      const pub=JSON.stringify(await crypto.subtle.exportKey('jwk',kp.publicKey));
      priv=JSON.stringify(await crypto.subtle.exportKey('jwk',kp.privateKey));
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,enc.encode(priv));
      me=await post('/api/register',{name,phone,auth,pub,encPriv:JSON.stringify({iv:b64(iv),ct:b64(ct)})});
    }else{
      me=await post('/api/login',{phone,auth});
      const e=JSON.parse(me.encPriv);
      priv=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},wk,unb64(e.ct)));
    }
    window.caches&&caches.delete('lynko-api-v2');
    localStorage.setItem('lynko_priv',priv);localStorage.setItem('lynko_id',me.id);localStorage.setItem('lynko_sid',me.sid);localStorage.setItem('lynko_phone',phone);
    location.href='/chat';
  }catch(e){$('err').textContent=e.name=='OperationError'?'Wrong number or password':e.message;$('go').disabled=false}
};
['nm','ph','p'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key=='Enter')$('go').click()}));
fetch('/api/me').then(r=>{if(r.ok&&localStorage.getItem('lynko_priv'))location.href='/chat'}).catch(()=>{});
</script>
<script src="/install.js" defer></script>
</body>
</html>
